<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Botón con Contador y Menú Desplegable</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    
    .menu-container {
      position: absolute;
      top: 0;
      right: 0;
      background-color: #333;
    }

    .menu {
      position: relative;
      display: inline-block;
    }

    .menu-btn {
      background-color: #333;
      color: white;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .menu-btn:hover {
      background-color: #575757;
    }

    .menu-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .menu-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .menu-content a:hover {
      background-color: #ddd;
    }

    .menu:hover .menu-content {
      display: block;
    }

    /* Contenido principal */
    #contenido {
      display: none;
      text-align: center;
      margin-top: 100px;
    }

    #contenido.visible {
      display: block;
    }

    button#mostrar-btn {
      margin: 30px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Menú desplegable superior derecho -->
  <div class="menu-container">
    <div class="menu">
      <button class="menu-btn">Da click aqui ▼</button>
      <div class="menu-content">
        <a href="Readme2.html">Nosotros</a>
        <a href="README.html">Cartita</a>
        <a href="readme18.html">18/06/2025</a>
        
      </div>
    </div>
  </div>

  
  <button id="mostrar-btn" onclick="mostrarContenido()">Mostrar</button>

  <div id="contenido">
    <img src="1000013499.jpg" alt="Imagen de ejemplo">
    <p id="texto">Veces Que Has Amado A Bry</p>
  </div>

  <script>
    let contador = 1;

    function mostrarContenido() {
      const contenedor = document.getElementById("contenido");
      const boton = document.getElementById("mostrar-btn");
      const texto = document.getElementById("texto");

      contenedor.classList.add("visible");
      texto.textContent = "Veces Que Has Amado A Bry " + contador;

      boton.disabled = true;
      contador++;

      setTimeout(() => {
        contenedor.classList.remove("visible");
        boton.disabled = false;
      }, 4000);
    }
  </script>

</body>
</html>
